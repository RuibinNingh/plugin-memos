plugins {
    id 'base'
}

group 'run.halo.memos.ui'

// corepack provides a working pnpm that matches the system Node version,
// unlike the node-gradle plugin's bundled pnpm (which requires Node 22).
def pnpm = ['corepack', 'pnpm@9.15.9']

tasks.register('pnpmInstall', Exec) {
    group = 'build'
    description = 'Installs UI dependencies via corepack pnpm.'
    workingDir = layout.projectDirectory.asFile
    commandLine = pnpm + ['install']
    inputs.files(fileTree(dir: layout.projectDirectory.asFile,
        includes: ['package.json', 'pnpm-lock.yaml']))
    outputs.dir(layout.projectDirectory.dir('node_modules'))
}

tasks.register('buildFrontend', Exec) {
    group = 'build'
    description = 'Builds the UI project via corepack pnpm.'
    workingDir = layout.projectDirectory.asFile
    commandLine = pnpm + ['run', 'build']
    dependsOn tasks.named('pnpmInstall')
    inputs.dir(layout.projectDirectory.dir('src'))
    inputs.files(fileTree(dir: layout.projectDirectory.asFile,
        includes: ['*.ts', '*.js', '*.json', '*.cjs']))
    outputs.dir(layout.buildDirectory.dir('dist'))
}

tasks.register('pnpmCheck', Exec) {
    group = 'verification'
    description = 'Runs unit tests via corepack pnpm.'
    workingDir = layout.projectDirectory.asFile
    commandLine = pnpm + ['run', 'test:unit']
    dependsOn tasks.named('pnpmInstall')
}

tasks.named('check') {
    dependsOn tasks.named('pnpmCheck')
}

tasks.named('assemble') {
    dependsOn tasks.named('buildFrontend')
}
