plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.6.2"
}

group 'run.halo.memos'
version = '1.1.2'

repositories {
    maven {
        name = 'Central Portal Snapshots'
        url = 'https://central.sonatype.com/repository/maven-snapshots/'

        // Only search this repository for the specific dependency
        content {
            includeGroupAndSubgroups('run.halo')
        }
    }
    mavenCentral()
}

dependencies {
    // Align with production Halo 2.25.3
    implementation platform('run.halo.tools.platform:plugin:2.25.0')
    compileOnly 'run.halo.app:api'

    // Markdown rendering for memos content (real-time Finder)
    implementation 'org.commonmark:commonmark:0.22.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

// Halo 2.x plugin descriptor must live at META-INF/halo/plugin.yaml inside the jar.
// Gradle's default processResources copies src/main/resources/plugin.yaml to the jar
// root, which Halo ignores. Keep the root copy (devtools' generatePluginComponentsIdx
// reads it from build/resources/main/plugin.yaml) and add a relocated copy.
tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/plugin.yaml') {
        into 'META-INF/halo'
        rename { 'plugin.yaml' }
    }
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.25.0'
    port = 8092
    externalUrl = 'http://192.168.0.145:8092'
}
